apiVersion: batch/v1
kind: Job
metadata:
  name: trimtab-analyze
  namespace: trimtab-local
  labels:
    app.kubernetes.io/name: trimtab
    app.kubernetes.io/component: analyzer
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trimtab
        app.kubernetes.io/component: analyzer
    spec:
      restartPolicy: Never
      containers:
        - name: trimtab
          image: trimtab-dev:latest
          imagePullPolicy: IfNotPresent
          args:
            - analyze
            - --config
            - /workspace/examples/demo/trimtab.yaml
            - --now
            - "2026-11-21T12:00:00Z"
            - --no-state-write
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
