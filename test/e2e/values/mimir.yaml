apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitoring
data:
  mimir.yaml: |
    target: all
    multitenancy_enabled: true

    server:
      http_listen_port: 8080
      log_level: info
      log_format: logfmt

    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data/common

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      tsdb:
        dir: /data/tsdb
        head_compaction_interval: 1m

    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: inmemory

    distributor:
      ring:
        kvstore:
          store: inmemory

    ingester:
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1

    store_gateway:
      sharding_ring:
        kvstore:
          store: inmemory
        replication_factor: 1

    ruler:
      enable_api: true
      rule_path: /data/ruler-temp
      evaluation_interval: 15s
      ring:
        kvstore:
          store: inmemory

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/rules

    alertmanager_storage:
      backend: filesystem
      filesystem:
        dir: /data/alertmanager

    frontend:
      query_stats_enabled: true
      log_queries_longer_than: 0s
      log_query_request_headers: "User-Agent,X-Dashboard-UID,X-Grafana-User,X-Scope-OrgID"

    limits:
      max_global_series_per_user: 100000
      out_of_order_time_window: 5m
      ingestion_rate: 50000
      ingestion_burst_size: 100000
      ruler_evaluation_delay_duration: 15s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mimir
    component: query-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
      component: query-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
        component: query-frontend
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:2.17.11
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/mimir/mimir.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mimir
    component: query-frontend
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30808
  selector:
    app.kubernetes.io/name: mimir
    component: query-frontend
