{{- if .Values.grafanaDashboard.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trimtab.fullname" . }}-dashboard
  labels:
    {{- include "trimtab.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  trimtab-overview.json: |-
{{ .Files.Get "dashboards/trimtab-overview.json" | indent 4 }}
{{- end }}
